name: Bootstrap exact npm dependency lock

on:
  push:
    branches: [optimize/ci-lockfile-20261009]
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate npm lockfile once
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependency graph" || exit 0
          git push origin HEAD:refs/heads/optimize/ci-lockfile-20261009
